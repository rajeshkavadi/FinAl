name: build-android-apk

# Experimental: build a debug APK with Buildozer (python-for-android 'webview'
# bootstrap wrapping the local web app). Run Buildozer directly on a pinned
# Ubuntu (the third-party buildozer-action's Docker image breaks on newer
# runner images).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packaging/android_apk/**'
      - '.github/workflows/build-apk.yml'
      - 'src/portfolio_analyzer/**'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Stage the app package into the APK source dir
        run: |
          cp -r src/portfolio_analyzer packaging/android_apk/portfolio_analyzer

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses-dev libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      - name: Install Buildozer + Cython
        run: pip install --upgrade "cython<3" buildozer

      - name: Build the debug APK
        working-directory: packaging/android_apk
        run: buildozer -v android debug

      - name: Show what was produced
        if: always()
        run: ls -la packaging/android_apk/bin || true

      - name: Upload APK as a workflow artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: PortfolioAnalyzer-apk
          path: packaging/android_apk/bin/*.apk

      - name: Publish APK to the android-build release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-build
          name: Android build (experimental)
          prerelease: true
          files: packaging/android_apk/bin/*.apk
