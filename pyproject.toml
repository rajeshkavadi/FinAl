[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-analyzer"
version = "0.9.2"
description = "Local MF + direct-equity portfolio analyzer, monitor and restructuring advisor (India)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["portfolio", "mutual-funds", "equity", "india", "xirr", "capital-gains"]
dependencies = [
    "openpyxl>=3.1",   # .xlsx import; CSV-only use needs nothing
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.10"]   # CAS/CG PDF parsing (desktop)
gdrive = ["google-api-python-client>=2.100", "google-auth>=2.30"]  # optional Drive sync
# 'mobile' = every feature using ONLY pure-Python deps (no Pillow/cryptography),
# so it installs on Pydroid 3 / Termux without any compilation:
#   pypdf         -> CAS/CG PDF read + decrypt (code falls back to it)
#   google-*      -> Drive sync (google-auth signs via pure-python rsa)
mobile = ["pypdf>=4", "google-api-python-client>=2.100", "google-auth>=2.30"]
dev = ["pytest>=7"]

[project.scripts]
portfolio-analyze = "portfolio_analyzer.cli.analyze:main"
portfolio-monitor = "portfolio_analyzer.cli.monitor:main"
portfolio-sync    = "portfolio_analyzer.cli.sync:main"
portfolio-web     = "portfolio_analyzer.cli.web:main"
portfolio-cg      = "portfolio_analyzer.cli.cg:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portfolio_analyzer = ["sample_data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
